name: CI

# The one way this repository breaks: manifest.json stops matching what is on
# disk. Neuron trusts the checksums in it, so a stale manifest is not a cosmetic
# problem -- it makes every install of that template fail a verification the
# user cannot diagnose.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: manifest.json matches the templates on disk
        run: node tools/build-manifest.mjs --check
